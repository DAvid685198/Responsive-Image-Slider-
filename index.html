<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <h1>Image Slider</h1>

    <!-- Slider 1: fills its parent (max 960px) -->
    <section class="slider" data-slider aria-roledescription="carousel" aria-label="Landscape photos">
      <div class="slider__viewport">
        <div class="slider__track">
          <figure class="slider__slide"><img src="https://picsum.photos/id/1018/1200/675" alt="Mountain lake at sunrise"></figure>
          <figure class="slider__slide"><img src="https://picsum.photos/id/1015/1200/675" alt="River winding through a valley"></figure>
          <figure class="slider__slide"><img src="https://picsum.photos/id/1039/1200/675" alt="Waterfall in a forest"></figure>
          <figure class="slider__slide"><img src="https://picsum.photos/id/1043/1200/675" alt="Foggy hills at dawn"></figure>
          <figure class="slider__slide"><img src="https://picsum.photos/id/1036/1200/675" alt="Snowy mountain peaks"></figure>
        </div>
      </div>
      <!-- Arrows and dots are generated by slider.js -->
    </section>

    <h2>Same component, narrower parent</h2>

    <!-- Slider 2: proves the component adapts to its container -->
    <div class="demo__narrow">
      <section class="slider" data-slider aria-roledescription="carousel" aria-label="City photos">
        <div class="slider__viewport">
          <div class="slider__track">
            <figure class="slider__slide"><img src="https://picsum.photos/id/1011/800/600" alt="Rower on a calm lake"></figure>
            <figure class="slider__slide"><img src="https://picsum.photos/id/1025/800/600" alt="Pug wrapped in a blanket"></figure>
            <figure class="slider__slide"><img src="https://picsum.photos/id/1074/800/600" alt="Lion resting in grass"></figure>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="slider.js"></script>
</body>
</html>
